[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    integration: requires a live Triton server (localhost:18001) with all
        four models loaded. NOT run by CI (no GPU on GitHub-hosted runners) --
        run these manually on the Vast.ai instance itself. See tests/README.md.
