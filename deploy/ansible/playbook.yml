---
# Automates deploy/REBUILD.md, steps 1/2/3/6. See this dir's README.md for
# what's deliberately left out (engine rebuilds, monitoring stack) and for
# the safety guard on the `supervisor` tag.

- name: Rebuild speech-cascade deployment
  hosts: speech_cascade
  become: true

  tasks:
    # ---------------------------------------------------------------
    # Step 0 (REBUILD.md "Layout recap"): the git-tracked repo itself.
    # Not part of REBUILD.md's numbered steps (it says "clone that
    # separately in the normal way") but needed before later steps can
    # reference deploy/requirements-*.txt and deploy/supervisor/*.
    # ---------------------------------------------------------------
    - name: Check whether the repo is already checked out
      ansible.builtin.stat:
        path: "{{ repo_dir }}/.git"
      register: repo_git_dir
      tags: [repo]

    - name: Clone speech-cascade
      ansible.builtin.git:
        repo: >-
          {{ repo_url | regex_replace('^https://', 'https://' + vault_github_token + '@')
             if vault_github_token | default('') else repo_url }}
        dest: "{{ repo_dir }}"
        version: "{{ repo_version }}"
      when: not repo_git_dir.stat.exists
      tags: [repo]

    - name: Scrub the token back out of origin's URL (it's only needed for the initial clone)
      ansible.builtin.command:
        cmd: "git remote set-url origin {{ repo_url }}"
        chdir: "{{ repo_dir }}"
      when:
        - not repo_git_dir.stat.exists
        - vault_github_token | default('')
      changed_when: true
      tags: [repo]

    # ---------------------------------------------------------------
    # Step 1: system packages (REBUILD.md step 1 / README.md quirks #1,2,6)
    # ---------------------------------------------------------------
    - name: Install system packages (MPI, CUDA 13.2 toolkit-only libs, DCGM)
      ansible.builtin.apt:
        name: "{{ apt_packages }}"
        state: present
        update_cache: true
      tags: [packages]

    # ---------------------------------------------------------------
    # libssl1.1 compat extraction (README.md quirk #5). Extracted only —
    # never installed system-wide, so system OpenSSL 3 is untouched.
    # ---------------------------------------------------------------
    - name: Ensure compat_libs directory exists
      ansible.builtin.file:
        path: "{{ compat_libs_dir }}"
        state: directory
        mode: "0755"
      tags: [packages]

    - name: Download libssl1.1 .deb (Ubuntu 20.04 build, extracted not installed)
      ansible.builtin.get_url:
        url: "{{ libssl1_1_deb_url }}"
        dest: "{{ compat_libs_dir }}/libssl1.1_1.1.1f-1ubuntu2_amd64.deb"
        mode: "0644"
      tags: [packages]

    - name: Extract libssl1.1 .so files (dpkg-deb -x, not dpkg -i)
      ansible.builtin.command:
        cmd: dpkg-deb -x libssl1.1_1.1.1f-1ubuntu2_amd64.deb extracted
        chdir: "{{ compat_libs_dir }}"
        creates: "{{ compat_libs_dir }}/extracted/usr/lib/x86_64-linux-gnu/libssl.so.1.1"
      tags: [packages]

    # ---------------------------------------------------------------
    # Step 2: restore weights/engines/Triton binary from S3.
    # This is a READ-ONLY sync from the bucket — the playbook never
    # writes back to it.
    # ---------------------------------------------------------------
    - name: Restore models, compiled engines, and the Triton binary from S3
      ansible.builtin.command:
        cmd: >-
          aws s3 sync {{ s3_bucket_uri }} {{ inference_dir }}/
        environment:
          AWS_ACCESS_KEY_ID: "{{ vault_aws_access_key_id }}"
          AWS_SECRET_ACCESS_KEY: "{{ vault_aws_secret_access_key }}"
      changed_when: true
      tags: [s3_restore]

    # ---------------------------------------------------------------
    # Step 3: three isolated venvs, exact pinned versions (not latest).
    # ---------------------------------------------------------------
    - name: "Create venv: {{ item.name }}"
      ansible.builtin.command:
        cmd: "{{ python_bin }} -m venv {{ item.path }}"
        creates: "{{ item.path }}/bin/python"
      loop: "{{ venvs }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [venvs]

    - name: "Install pinned requirements: {{ item.name }}"
      ansible.builtin.pip:
        requirements: "{{ item.requirements }}"
        virtualenv: "{{ item.path }}"
        virtualenv_command: "{{ python_bin }} -m venv"
      loop: "{{ venvs }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [venvs]

    - name: Verify /venv/main's numpy pin held (README.md quirk #10)
      ansible.builtin.command:
        cmd: "{{ item.path }}/bin/python -c 'import numpy; print(numpy.__version__)'"
      register: numpy_check
      changed_when: false
      loop: "{{ venvs }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.expected_numpy_version is defined
      tags: [venvs]

    - name: Fail if numpy silently upgraded (breaks TensorRT-LLM's compiled bindings)
      ansible.builtin.fail:
        msg: >-
          {{ item.item.name }}'s numpy is {{ item.stdout }}, expected
          {{ item.item.expected_numpy_version }}. Something in
          requirements-main.txt (or install order) upgraded it — see
          README.md quirk #10 before proceeding.
      when:
        - item.item.expected_numpy_version is defined
        - (item.stdout | default('')) != item.item.expected_numpy_version
      loop: "{{ numpy_check.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      tags: [venvs]

    # ---------------------------------------------------------------
    # Step 6: supervisor services.
    # ---------------------------------------------------------------
    - name: Check current state of speech-cascade-triton before touching it
      ansible.builtin.command: supervisorctl status speech-cascade-triton
      register: triton_status
      changed_when: false
      failed_when: false
      tags: [supervisor]

    - name: Refuse to install/restart speech-cascade-triton while it's already running
      ansible.builtin.fail:
        msg: >-
          speech-cascade-triton is already RUNNING on this host. Restarting
          it duplicates GPU model loads and fights over ports 18000-18002 —
          see this dir's README's "The one dangerous tag". If you've
          confirmed nothing else depends on the current process, re-run
          with -e confirm_triton_restart=true.
      when:
        - "'RUNNING' in triton_status.stdout"
        - not confirm_triton_restart
      tags: [supervisor]

    - name: Install supervisor wrapper scripts
      ansible.builtin.copy:
        src: "{{ repo_dir }}/deploy/supervisor/speech-cascade-{{ item }}.sh"
        dest: "{{ supervisor_scripts_dir }}/speech-cascade-{{ item }}.sh"
        mode: "0755"
        remote_src: true
      loop: "{{ supervisor_services }}"
      tags: [supervisor]

    - name: Install supervisor conf.d entries
      ansible.builtin.copy:
        src: "{{ repo_dir }}/deploy/supervisor/speech-cascade-{{ item }}.conf"
        dest: "{{ supervisor_confd_dir }}/speech-cascade-{{ item }}.conf"
        mode: "0644"
        remote_src: true
      loop: "{{ supervisor_services }}"
      tags: [supervisor]

    - name: supervisorctl reread
      ansible.builtin.command: supervisorctl reread
      changed_when: true
      tags: [supervisor]

    - name: supervisorctl update
      ansible.builtin.command: supervisorctl update
      changed_when: true
      tags: [supervisor]

    # ---------------------------------------------------------------
    # Step 7: verify. Triton takes ~5-6 min to become READY (TensorRT-LLM
    # import + engine load) — poll rather than assuming it's instant.
    # ---------------------------------------------------------------
    - name: Wait for Triton's repository index endpoint to respond
      ansible.builtin.uri:
        url: http://localhost:18000/v2/repository/index
        method: POST
        status_code: 200
      register: repo_index
      until: repo_index.status == 200
      retries: 40
      delay: 15
      tags: [verify]

    - name: Show model load state
      ansible.builtin.debug:
        msg: "{{ repo_index.json }}"
      tags: [verify]

    - name: Fail if any model isn't READY
      ansible.builtin.fail:
        msg: "Model {{ item.name }} is in state {{ item.state }}, not READY."
      loop: "{{ repo_index.json }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.state is defined and item.state != "READY"
      tags: [verify]

    - name: Run integration tests (needs live GPU server, ~several minutes)
      ansible.builtin.command:
        cmd: /venv/main/bin/python -m pytest tests/integration -v
        chdir: "{{ repo_dir }}"
      register: integration_tests
      changed_when: false
      when: run_integration_tests | bool
      tags: [verify, integration_tests]

    - name: Show integration test output
      ansible.builtin.debug:
        var: integration_tests.stdout_lines
      when: run_integration_tests | bool
      tags: [verify, integration_tests]
