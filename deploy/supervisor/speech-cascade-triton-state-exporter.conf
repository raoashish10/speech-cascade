[program:speech-cascade-triton-state-exporter]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/speech-cascade-triton-state-exporter.sh
autostart=true
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
