[program:speech-cascade-triton]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/speech-cascade-triton.sh
autostart=true
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopsignal=TERM
; Triton's own graceful shutdown (unloading 4 GPU models, tearing down the
; LLM's MPI worker) takes longer than the gateway's -- give it real room
; before supervisor escalates to SIGKILL.
stopwaitsecs=30
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
