[program:speech-cascade-gateway]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/speech-cascade-gateway.sh
autostart=true
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
