# Two services, matching the two isolated processes README.md already
# describes (Triton + the streaming gateway) -- just containerized and
# talking over the Docker network instead of both binding 127.0.0.1 on the
# same bare-metal box. See docker/README.md for the full rundown, including
# what this deliberately does NOT replace (a GPU host + nvidia-container-toolkit
# still has to exist under this) and the alternative two-pod Runpod shape
# that skips Compose entirely.
#
# Defaults to the PUBLISHED, verified images (docker/README.md's "Build
# status" table: gateway built by CI, triton built by hand via crane on a
# GPU pod -- both confirmed working by actually running them). This is
# deliberate: the triton image needs ~60GB free disk and a real Docker host
# to build locally (see docker/README.md "Building the triton image"), so
# defaulting to a local rebuild would force that cost on everyone just to
# start the service.
#
#   docker compose pull && docker compose up -d      # published images (default)
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#                                                      # build locally instead (dev)

services:
  triton:
    image: ghcr.io/raoashish10/speech-cascade-triton:${IMAGE_TAG:-latest}
    # Not published to the host on purpose -- reachable only from other
    # containers on this compose network (i.e. `gateway`, by service name
    # `triton`), the same "internal-only" property README.md describes for
    # the bare-metal deployment's 127.0.0.1-bound ports. docker/README.md's
    # "Two-pod deployment on Runpod" section explains why this matters:
    # Triton itself has no authentication of any kind and relies entirely
    # on being unreachable.
    expose:
      - "18000"
      - "18001"
      - "18002"
    environment:
      S3_BUCKET_URI: "${S3_BUCKET_URI:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
    volumes:
      - inference-data:/workspace/speech-cascade-inference/models
    # Requires nvidia-container-toolkit on the host (`nvidia-ctk runtime
    # configure --runtime=docker` or equivalent) -- this is what every GPU
    # provider from the "which provider" discussion (RunPod, SaladCloud,
    # Lambda Labs, ...) either preinstalls on their Docker-native
    # images/templates or documents as a setup step. `count: 1` assumes a
    # single-GPU host -- bump this (or switch to `device_ids`) for a
    # multi-GPU box.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18000/v2/health/ready"]
      # Triton takes ~5-6 minutes to become ready once models/ is already
      # populated (TensorRT-LLM import + sequential engine load across all
      # 4 models) -- README.md's "Managing the service" section gives this
      # same number for the bare-metal deployment. On a first start with an
      # empty inference-data volume, add the entrypoint's from-scratch
      # bootstrap time on top (~2-3 min, see docker/README.md "Quick start").
      interval: 15s
      timeout: 5s
      retries: 80
      start_period: 60s
    restart: unless-stopped

  gateway:
    image: ghcr.io/raoashish10/speech-cascade-gateway:${IMAGE_TAG:-latest}
    depends_on:
      triton:
        condition: service_healthy
    environment:
      TRITON_URL: triton:18001
      GATEWAY_MAX_SESSIONS: "${GATEWAY_MAX_SESSIONS:-4}"
      GATEWAY_MAX_SESSIONS_PER_KEY: "${GATEWAY_MAX_SESSIONS_PER_KEY:-2}"
      # Credentials for /ws/stream. Required in this deployment shape --
      # there's no Vast.ai Caddy auth edge in front of the gateway here, so
      # the process checks them itself. It REFUSES TO START if none of the
      # three below is set, rather than silently accepting anonymous
      # connections; see streaming_gateway/auth.py.
      #
      # Prefer API keys: individually revocable, named in the logs, and what
      # makes the per-key cap above meaningful. Mint one with
      # `python3 -m streaming_gateway.auth --new <name>`.
      GATEWAY_API_KEYS: "${GATEWAY_API_KEYS:-}"
      # Legacy single shared token. Still honored so the bare-metal
      # deployment's convention keeps working; prefer GATEWAY_API_KEYS.
      GATEWAY_AUTH_TOKEN: "${GATEWAY_AUTH_TOKEN:-}"
      # Set to 1 ONLY when something upstream (your own reverse proxy, a
      # provider auth edge) already authenticates every connection.
      GATEWAY_ALLOW_ANONYMOUS: "${GATEWAY_ALLOW_ANONYMOUS:-}"
    ports:
      - "${GATEWAY_PORT:-18010}:18010"
    restart: unless-stopped

volumes:
  # Holds models/ (weights + compiled TensorRT engines) -- bootstrapped from
  # the Hugging Face Hub by the triton container's entrypoint on first start
  # if empty (see docker/README.md "Quick start"), or restored from S3 if
  # S3_BUCKET_URI is set, or populate it yourself. Deliberately a named
  # volume, not baked into the image -- these are large, GPU-arch-pinned
  # artifacts you don't want in an image layer.
  inference-data:
