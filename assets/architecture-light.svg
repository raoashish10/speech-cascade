<svg viewBox="0 0 1020 460" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="voice_pipeline chains whisper_asr, qwen_llm, and chatterbox_tts inside one Triton BLS call, adding a batch dimension before calling whisper_asr and chatterbox_tts and stripping it from their replies, while qwen_llm takes and returns no batch dimension at all.">
  <defs>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-light-dashed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- client -->
  <rect x="20" y="190" width="140" height="110" rx="10" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
  <text x="90" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1f2328">Client</text>
  <text x="90" y="258" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#57606a">gRPC / HTTP</text>

  <!-- voice_pipeline outer frame -->
  <rect x="190" y="30" width="800" height="400" rx="14" fill="none" stroke="#0969da" stroke-width="2"/>
  <text x="210" y="56" font-family="sans-serif" font-size="13" font-weight="600" fill="#0969da">voice_pipeline — Triton BLS orchestrator</text>
  <text x="210" y="73" font-family="sans-serif" font-size="11" fill="#57606a">max_batch_size: 0 · no GPU or weights of its own</text>

  <!-- whisper_asr -->
  <rect x="230" y="190" width="200" height="110" rx="10" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
  <text x="330" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1f2328">whisper_asr</text>
  <text x="330" y="242" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#57606a">TensorRT-LLM Whisper</text>
  <text x="330" y="278" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292f">AUDIO_SAMPLES →</text>
  <text x="330" y="292" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292f">TRANSCRIPT</text>

  <!-- qwen_llm -->
  <rect x="500" y="190" width="200" height="110" rx="10" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
  <text x="600" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1f2328">qwen_llm</text>
  <text x="600" y="242" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#57606a">Qwen3-8B-NVFP4 · streaming</text>
  <text x="600" y="278" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292f">PROMPT →</text>
  <text x="600" y="292" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292f">GENERATED_TEXT</text>

  <!-- chatterbox_tts -->
  <rect x="770" y="190" width="200" height="110" rx="10" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
  <text x="870" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1f2328">chatterbox_tts</text>
  <text x="870" y="242" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#57606a">Chatterbox-Turbo (vLLM+PyTorch)</text>
  <text x="870" y="278" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292f">TEXT →</text>
  <text x="870" y="292" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292f">AUDIO_SAMPLES</text>

  <!-- forward chain -->
  <line x1="160" y1="245" x2="228" y2="245" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow-light)"/>
  <text x="194" y="266" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#57606a">+batch dim</text>

  <line x1="430" y1="245" x2="498" y2="245" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow-light)"/>
  <text x="464" y="266" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#57606a">no batch dim</text>

  <line x1="700" y1="245" x2="768" y2="245" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow-light)"/>
  <text x="734" y="266" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#57606a">+batch dim</text>

  <!-- response aggregation (dashed) -->
  <line x1="330" y1="300" x2="330" y2="345" stroke="#8b949e" stroke-width="1.25" stroke-dasharray="4 3"/>
  <line x1="600" y1="300" x2="600" y2="345" stroke="#8b949e" stroke-width="1.25" stroke-dasharray="4 3"/>
  <line x1="870" y1="300" x2="870" y2="345" stroke="#8b949e" stroke-width="1.25" stroke-dasharray="4 3"/>
  <line x1="330" y1="345" x2="870" y2="345" stroke="#8b949e" stroke-width="1.25" stroke-dasharray="4 3"/>
  <polyline points="330,345 90,345 90,302" fill="none" stroke="#8b949e" stroke-width="1.25"
            stroke-dasharray="4 3" marker-end="url(#arrow-light-dashed)"/>
  <text x="510" y="372" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#57606a">
    response to client: TRANSCRIPT + GENERATED_TEXT + AUDIO_SAMPLES + SAMPLE_RATE
  </text>
</svg>
