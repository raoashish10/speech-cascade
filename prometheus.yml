global:
  scrape_interval: 2s
  evaluation_interval: 2s

# Alerting rules -- evaluated by Prometheus itself, exposed at /api/v1/alerts.
# No Alertmanager here by design; see docs/monitoring.md for why. Path is
# absolute because this config is invoked with an arbitrary cwd from
# supervisor (see /opt/supervisor-scripts/prometheus.sh).
rule_files:
  - /workspace/speech-cascade-inference/monitoring/alert_rules.yml

scrape_configs:
  - job_name: 'triton'
    static_configs:
      - targets: ['127.0.0.1:18002']

  # Triton's model READY/UNAVAILABLE state isn't natively a Prometheus metric
  # (only available via the HTTP repository-index API). scripts/triton_state_exporter.py
  # polls that API and republishes it as a gauge here. See docs/monitoring.md.
  - job_name: 'triton_state_exporter'
    static_configs:
      - targets: ['127.0.0.1:9109']
