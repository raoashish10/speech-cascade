name: build-images

# Builds and pushes docker/gateway and docker/triton to GHCR with real
# Docker/BuildKit.
#
# Why this exists rather than building on a GPU host: Runpod pods (and most
# managed GPU containers) can't run Docker-in-Docker -- the sandbox blocks
# the unshare()/clone() syscalls nested containers need. The workaround used
# during development was kaniko (daemonless, chroot-based), and it produced
# a SILENTLY BROKEN image: files written by `RUN pip install ...` were
# missing from the pushed layers, while everything inherited from the base
# image was fine. That failure mode is invisible at build time -- the build
# "succeeds", the pip output says "Successfully installed", the in-RUN
# assertions pass -- and only shows up at runtime as
# ModuleNotFoundError/missing .so for exactly the packages the Dockerfile
# added. Confirmed by running the identical pip sequence by hand on the same
# base image, where it produces a fully working environment. Hence: real
# BuildKit here, not kaniko.
#
# DISK: the triton image is large and the first attempt at this job died
# with "No space left on device". It has since been slimmed from ~40GB
# unpacked (~27GB compressed) to ~24GB unpacked by removing ~19GB of
# duplicate CUDA userspace -- both pip installs were replaying `pip freeze`
# dumps from a CUDA 12.8 box onto a CUDA 13.1 base image, so each installed
# its own complete cu12 wheel set beside the CUDA 13 libraries the base
# already ships. See docker/triton/Dockerfile and deploy/image-exclude-*.txt
# for the measurements.
#
# A standard GitHub-hosted runner starts with roughly 14GB free and the
# cleanup step below reclaims ~30GB more, so ~24GB should now fit -- with
# little enough headroom that the "Disk after build" step is worth reading
# on any failure. If it still dies for want of space, the remaining options
# are (a) a larger runner, (b) a self-hosted runner, or (c) a smaller base
# image: ~22GB of the ~24GB is the NGC base itself, so nothing else in this
# repo can move the number much.
#
# The gateway job is ~400MB and has no such problem.

on:
  workflow_dispatch:
    inputs:
      build_triton:
        description: "Build the large triton image (~24GB unpacked, tight on a standard runner)"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io

jobs:
  gateway:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gateway/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/speech-cascade-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  triton:
    if: ${{ inputs.build_triton }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Reclaims ~30GB. Everything removed here is preinstalled runner
      # tooling this build never touches.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No cache-to here on purpose: the layer cache for an image this size
      # would blow past the 10GB per-repo GitHub Actions cache limit and
      # evict itself every run, costing disk for no benefit.
      - name: Build and push triton
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/triton/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/speech-cascade-triton:latest

      - name: Disk after build
        if: always()
        run: df -h /
