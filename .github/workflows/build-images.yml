name: build-images

# Builds and pushes docker/gateway to GHCR with real Docker/BuildKit.
#
# THE TRITON IMAGE IS DELIBERATELY NOT BUILT HERE. That is a decision, not
# an omission, and it is not worth re-litigating without new information --
# the full record is below so nobody spends another day rediscovering it.
#
# Why not on a GPU host: Runpod pods (and most managed GPU containers) can't
# run Docker-in-Docker; the sandbox blocks the unshare()/clone() syscalls
# nested containers need. Confirmed by trying it.
#
# Why not kaniko (the daemonless, chroot-based workaround used during
# development): it produces a SILENTLY BROKEN image. Files written by
# `RUN pip install ...` are missing from the pushed layers, while everything
# inherited from the base image is fine. The build reports success, pip says
# "Successfully installed", the in-RUN assertions pass, and the image then
# fails at model load with ModuleNotFoundError for exactly the packages the
# Dockerfile added. Confirmed by running the identical pip sequence by hand
# on the same base image, where it produces a fully working environment.
#
# Why not a GitHub-hosted runner, which is what this job used to attempt:
# disk. Measured, not estimated:
#
#   nvcr.io/nvidia/tritonserver:26.03-trtllm-python-py3   15.2 GB compressed
#                                                          ~22 GB extracted
#   everything this repo adds on top                        ~2.5 GB
#
# A standard runner has ~20 GB free on / (73 GB disk, ~54 GB of it
# preinstalled tooling). The cleanup step this job used to run reclaimed
# enough to reach the low 40s of GB, and it still died -- twice -- with
# "System.IO.IOException: No space left on device", roughly 5 minutes in,
# during the base image pull and before a single pip install ran. The peak
# is the extracted base plus its compressed layers plus our layers, ~35 GB,
# against a budget that has to also leave room for the runner's own logs.
# When it blows, the runner dies hard enough that the job logs are
# unrecoverable (BlobNotFound), so each failure costs a rerun to diagnose.
#
# The image was slimmed from ~40 GB to ~24 GB before giving up on this
# (see deploy/image-exclude-*.txt) and it was not enough, because ~22 GB of
# the ~24 GB is the NGC base image itself: tensorrt_llm 3.5 GB, flash_attn's
# single 1.7 GB .so, torch, CUDA 13, Triton. None of that is fat this repo
# can trim -- it is what serving TensorRT-LLM engines requires.
#
# Splitting the pipeline into per-stage images does not rescue this either:
# whisper_asr and qwen_llm BOTH need TensorRT-LLM, so two of the three
# images would still carry the same 22 GB base. Only chatterbox_tts could
# use a smaller one (~6.5 GB, it needs no TRT-LLM). See docker/README.md.
#
# So: build the triton image by hand, on a machine with Docker and ~60 GB
# free. docker/README.md has the command and what to verify afterwards.
# If this ever moves back into CI it needs a larger or self-hosted runner,
# not another round of slimming.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker/gateway/**"
      - "streaming_gateway/**"
      - ".github/workflows/build-images.yml"

env:
  REGISTRY: ghcr.io

jobs:
  gateway:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gateway/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/speech-cascade-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
